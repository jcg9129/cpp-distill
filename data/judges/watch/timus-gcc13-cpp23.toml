schema = 1

[[sources]]
id = "timus"
url = "https://acm.timus.ru/help.aspx?topic=cpp&locale=ru"
kind = "deployment"
extractor = "timus"
excerpt = "MinGW GCC 13.2.0 x64 и Clang 17.0.6 x64 взяты из сборки WinLibs. Компиляторы запускаются со следующими параметрами:\ng++ -x c++ -std=c++23 -O2 -fno-strict-aliasing -march=native -DONLINE_JUDGE -static -Wl,-s,--stack=67108864 -o %1.exe %1"
[sources.expected]
language_id = "C++23"
compiler_family = "gcc"
compiler_version = "13.2.0"
compile_arguments = ["g++", "-x", "c++", "-std=c++23", "-O2", "-fno-strict-aliasing", "-march=native", "-DONLINE_JUDGE", "-static", "-Wl,-s,--stack=67108864", "-o", "%1.exe", "%1"]
runtime_notes = ["MinGW GCC 13.2.0 x64", "WinLibs"]
