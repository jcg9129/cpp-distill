# SPDX-License-Identifier: GPL-3.0-or-later
name: Judge macro snapshots
on:
  workflow_dispatch:
    inputs:
      profiles:
        description: all, or comma-separated profile names
        default: all
        required: true
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - id: matrix
        env:
          PROFILES: ${{ inputs.profiles }}
        run: |
          set -euo pipefail
          echo "matrix=$(python3 ci/profiles/matrix.py --profiles "$PROFILES")" >> "$GITHUB_OUTPUT"
  snapshot:
    needs: plan
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      PROFILE: ${{ matrix.profile }}
      GCC_VERSION: ${{ matrix.version }}
      BUILD_PROVENANCE: ${{ matrix.build }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - if: runner.os == 'Windows'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Check AtCoder published recipe has not changed
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://img.atcoder.jp/file/language-update/2025-10/017-23_gcc_14-2-0.toml -o atcoder-published.toml
          echo "$(cat ci/profiles/atcoder-recipe.sha256)  atcoder-published.toml" | sha256sum --check
      - name: Cache GCC built from AtCoder recipe
        if: runner.os == 'Linux'
        id: gcc-cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ github.workspace }}/out/atcoder-gcc
          key: atcoder-gcc-ubuntu-24.04-${{ hashFiles('ci/profiles/atcoder-recipe.sh', 'ci/profiles/atcoder-recipe.sha256') }}
      - name: Build GCC 15.2.0 with AtCoder configure options
        if: runner.os == 'Linux' && steps.gcc-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential flex bison texinfo curl
          bash ci/profiles/atcoder-recipe.sh "$PWD/out/atcoder-gcc" "$PWD/out/atcoder-build"
      - name: Snapshot AtCoder effective command
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$PWD/out/atcoder-gcc/lib64:${LD_LIBRARY_PATH:-}"
          python3 ci/profiles/snapshot.py data/judges/atcoder.toml --compiler "$PWD/out/atcoder-gcc/bin/g++" --reproduced-build "$BUILD_PROVENANCE"
      - name: Install archived MSYS2 package and matching dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (!(Test-Path C:\msys64\usr\bin\bash.exe)) { throw 'MSYS2 missing' }
          & C:\msys64\usr\bin\bash.exe -lc 'cd "$GITHUB_WORKSPACE" && bash ci/profiles/install-mingw.sh "$GCC_VERSION"'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Snapshot Codeforces effective command
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PATH = "C:\msys64\mingw64\bin;$env:PATH"
          python ci/profiles/snapshot.py data/judges/codeforces.toml --compiler C:/msys64/mingw64/bin/g++.exe --reproduced-build $env:BUILD_PROVENANCE
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: snapshot-${{ matrix.profile }}
          path: data/judges/${{ matrix.profile }}-predefined.txt
          if-no-files-found: error
