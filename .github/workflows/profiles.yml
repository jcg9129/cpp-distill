# SPDX-License-Identifier: GPL-3.0-or-later
name: Judge macro snapshots
on:
  workflow_dispatch:
    inputs:
      profiles:
        description: all, or comma-separated profile names
        default: all
        required: true
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - id: matrix
        env:
          PROFILES: ${{ inputs.profiles }}
        shell: bash
        run: |
          set -euo pipefail
          selected=$(python3 ci/profiles/matrix.py --profiles "$PROFILES")
          echo "matrix=$selected" >> "$GITHUB_OUTPUT"
  snapshot:
    needs: plan
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      PROFILE: ${{ matrix.profile }}
      GCC_VERSION: ${{ matrix.version }}
      GCC_IMAGE: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - if: runner.os == 'Windows'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Snapshot with exact upstream GCC on Linux x86_64
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --platform linux/amd64 -v "$PWD:/work" -w /work "$GCC_IMAGE" bash -c '
            set -euo pipefail
            apt-get update -qq
            apt-get install -y --no-install-recommends python3
            python3 ci/profiles/snapshot.py "data/judges/$1.toml" --compiler /usr/local/bin/g++
          ' bash "$PROFILE"
      - name: Install exact MinGW-w64 GCC package or fail
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (!(Test-Path C:\msys64\usr\bin\bash.exe)) { throw 'MSYS2 missing from windows-2025 runner' }
          & C:\msys64\usr\bin\bash.exe -lc 'cd "$GITHUB_WORKSPACE" && bash ci/profiles/install-mingw.sh "$GCC_VERSION"'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Snapshot MinGW defaults without judge defines
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PATH = "C:\msys64\mingw64\bin;$env:PATH"
          python ci/profiles/snapshot.py "data/judges/$env:PROFILE.toml" --compiler C:/msys64/mingw64/bin/g++.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: snapshot-${{ matrix.profile }}
          path: data/judges/${{ matrix.profile }}-predefined.txt
          if-no-files-found: error
