# SPDX-License-Identifier: GPL-3.0-or-later
name: Judge macro snapshots
on:
  workflow_dispatch:
    inputs:
      profiles:
        description: all, or comma-separated full names (codeforces-gcc14-cpp23, atcoder-gcc15-gnupp23, cses-gcc13-cpp23, qoj-gcc15-cpp23, kattis-gcc15-gnupp23, yukicoder-gcc16-cpp23, yukicoder-gcc16-gnupp23)
        default: all
        required: true
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      runner_matrix: ${{ steps.matrix.outputs.runner_matrix }}
      container_matrix: ${{ steps.matrix.outputs.container_matrix }}
      has_runner: ${{ steps.matrix.outputs.has_runner }}
      has_container: ${{ steps.matrix.outputs.has_container }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - id: matrix
        env:
          PROFILES: ${{ inputs.profiles }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          sys.path.insert(0, 'ci/profiles')
          from matrix import job_matrices
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for key, value in job_matrices(os.environ['PROFILES']).items():
                  output.write(key + '=' + json.dumps(value, separators=(',', ':')) + '\n')
          PY
  snapshot:
    needs: plan
    if: needs.plan.outputs.has_runner == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.runner_matrix) }}
    env:
      PROFILE: ${{ matrix.profile }}
      COMPILER_PROVENANCE: ${{ matrix.compiler }}
      BUILD_PROVENANCE: ${{ matrix.build }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - if: runner.os == 'Windows'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@a102174a2b586eec2ea151a69e6fd14404a8ce7c # v1.13.0
        with:
          arch: x64
      # The diagnostic CLI is built with the platform's normal toolchain (as in
      # ci.yml); the judge compiler only compiles and runs the probe.
      - name: Build diagnostic distill (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          cmake -S . -B out/profile-probe -G Ninja -DCMAKE_BUILD_TYPE=Release -DDISTILL_PROFILE_ONLY=ON -DBUILD_TESTING=OFF
          cmake --build out/profile-probe --target distill --parallel 2
          python3 ci/profiles/test_probe_cli.py out/profile-probe/distill tests/unit/fixtures/profile
      - name: Build diagnostic distill (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake -S . -B out/profile-probe -G Ninja -DCMAKE_BUILD_TYPE=Release -DDISTILL_PROFILE_ONLY=ON -DBUILD_TESTING=OFF -DCMAKE_CXX_COMPILER=cl -DCMAKE_RC_COMPILER=rc
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build out/profile-probe --target distill --parallel 2
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & "$env:pythonLocation/python.exe" ci/profiles/test_probe_cli.py out/profile-probe/distill.exe tests/unit/fixtures/profile
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Check AtCoder published recipe has not changed
        if: matrix.acquisition == 'atcoder'
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://img.atcoder.jp/file/language-update/2025-10/017-23_gcc_14-2-0.toml -o atcoder-published.toml
          echo "$(cat ci/profiles/atcoder-recipe.sha256)  atcoder-published.toml" | sha256sum --check
      - name: Cache GCC built from AtCoder recipe
        if: matrix.acquisition == 'atcoder'
        id: gcc-cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ github.workspace }}/out/atcoder-gcc
          key: atcoder-gcc-ubuntu-24.04-${{ hashFiles('ci/profiles/atcoder-recipe.sh', 'ci/profiles/atcoder-recipe.sha256') }}
      - name: Build GCC 15.2.0 with AtCoder configure options
        if: matrix.acquisition == 'atcoder' && steps.gcc-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential flex bison texinfo curl
          bash ci/profiles/atcoder-recipe.sh "$PWD/out/atcoder-gcc" "$PWD/out/atcoder-build"
      - name: Snapshot AtCoder effective command
        if: matrix.acquisition == 'atcoder'
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$PWD/out/atcoder-gcc/lib64:${LD_LIBRARY_PATH:-}"
          python3 ci/profiles/snapshot.py data/judges/atcoder-gcc15-gnupp23.toml --compiler "$PWD/out/atcoder-gcc/bin/g++" --reproduced-build "$BUILD_PROVENANCE"
      - name: Produce AtCoder expected diagnostic output
        if: matrix.acquisition == 'atcoder'
        run: |
          set -euo pipefail
          # -march=native facts depend on the runner CPU; record which one.
          grep -m1 'model name' /proc/cpuinfo || true
          "$PWD/out/atcoder-gcc/bin/g++" -march=native -Q --help=target | grep -E '^\s+-march=' || true
          export LD_LIBRARY_PATH="$PWD/out/atcoder-gcc/lib64:${LD_LIBRARY_PATH:-}"
          python3 ci/profiles/probe.py data/judges/atcoder-gcc15-gnupp23.toml --compiler "$PWD/out/atcoder-gcc/bin/g++" --distill out/profile-probe/distill
      # Keep the shared runner job: it already supplies the normal distill
      # toolchain. The judge compiler is separately installed at an exact revision.
      - name: Install exact Ubuntu compiler for CSES
        if: matrix.acquisition == 'ubuntu'
        run: bash ci/profiles/install-ubuntu.sh "$COMPILER_PROVENANCE"
      - name: Snapshot CSES effective command (approximate)
        if: matrix.acquisition == 'ubuntu'
        run: |
          set -euo pipefail
          python3 ci/profiles/snapshot.py data/judges/cses-gcc13-cpp23.toml --compiler /usr/bin/g++-13
      - name: Produce CSES expected diagnostic output
        if: matrix.acquisition == 'ubuntu'
        run: |
          set -euo pipefail
          python3 ci/profiles/probe.py data/judges/cses-gcc13-cpp23.toml --compiler /usr/bin/g++-13 --distill out/profile-probe/distill
      - name: Install exact Homebrew bottle for yukicoder
        if: matrix.acquisition == 'homebrew'
        run: python3 ci/profiles/homebrew.py "$COMPILER_PROVENANCE"
      # Each dialect has its own matrix row, capture and artifact. Ubuntu 24.04
      # supplies system headers; the judge's plugin is deliberately omitted.
      - name: Snapshot yukicoder effective command (approximate)
        if: matrix.acquisition == 'homebrew'
        run: |
          set -euo pipefail
          unset CPATH CPLUS_INCLUDE_PATH C_INCLUDE_PATH GCC_EXEC_PREFIX COMPILER_PATH LIBRARY_PATH
          python3 ci/profiles/snapshot.py "data/judges/$PROFILE.toml" --compiler /home/linuxbrew/.linuxbrew/bin/g++-16
      - name: Produce yukicoder expected diagnostic output
        if: matrix.acquisition == 'homebrew'
        run: |
          set -euo pipefail
          unset CPATH CPLUS_INCLUDE_PATH C_INCLUDE_PATH GCC_EXEC_PREFIX COMPILER_PATH LIBRARY_PATH
          python3 ci/profiles/probe.py "data/judges/$PROFILE.toml" --compiler /home/linuxbrew/.linuxbrew/bin/g++-16 --distill out/profile-probe/distill
      - name: Install exact MSYS2 compiler and dependency closure
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (!(Test-Path C:\msys64\usr\bin\bash.exe)) { throw 'MSYS2 missing' }
          & C:\msys64\usr\bin\bash.exe -lc 'cd "$(/usr/bin/cygpath -u "$GITHUB_WORKSPACE")" && /usr/bin/bash ci/profiles/install-mingw.sh "$COMPILER_PROVENANCE"'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Snapshot Codeforces effective command
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PATH = "C:\msys64\mingw64\bin;$env:PATH"
          $provenanceArgs = @()
          if ($env:BUILD_PROVENANCE) { $provenanceArgs = @('--reproduced-build', $env:BUILD_PROVENANCE) }
          & "$env:pythonLocation/python.exe" ci/profiles/snapshot.py data/judges/codeforces-gcc14-cpp23.toml --compiler C:/msys64/mingw64/bin/g++.exe @provenanceArgs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Produce Codeforces expected diagnostic output
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PATH = "C:\msys64\mingw64\bin;$env:PATH"
          & "$env:pythonLocation/python.exe" ci/profiles/probe.py data/judges/codeforces-gcc14-cpp23.toml --compiler C:/msys64/mingw64/bin/g++.exe --distill out/profile-probe/distill.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: snapshot-${{ matrix.profile }}
          path: |
            data/judges/${{ matrix.profile }}-predefined.txt
            data/judges/${{ matrix.profile }}-probe-expected.txt
          if-no-files-found: error
  # A separate job keeps container: absent for all existing runner rows.
  # Job-level if is evaluated before matrix expansion, so an empty partition
  # is skipped even when dispatch selects only a runner or only a container.
  snapshot-container:
    needs: plan
    if: needs.plan.outputs.has_container == 'true'
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.container }}
      options: --user 0
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.container_matrix) }}
    defaults:
      run:
        shell: bash
    env:
      PROFILE: ${{ matrix.profile }}
      COMPILER_PROVENANCE: ${{ matrix.compiler }}
    steps:
      # Containers run as root. Install git before checkout and provide the
      # normal C++ toolchain and Python 3.11+ used by the diagnostic CLI.
      - name: Install container tools
        if: matrix.acquisition == 'ubuntu'
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y --no-install-recommends ca-certificates git python3 cmake ninja-build g++
      # Do not replace the image's compiler with an archive package. Start with
      # sh so bash need not be present until this bootstrap has completed.
      - name: Verify Kattis image compiler and install diagnostic tools
        if: matrix.acquisition == 'image'
        shell: sh
        run: |
          set -eu
          test "$(g++-15 -dumpfullversion)" = 15.2.0
          g++-15 -dumpmachine
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          # Keep the image's existing compiler, headers and runtime packages
          # unchanged. If tooling requires upgrades, fail for review instead.
          dpkg-query -W -f='${binary:Package} ${db:Status-Status}\n' |
            awk '$2 == "installed" {print $1}' | xargs -r apt-mark hold > /dev/null
          # ca-certificates and bash are already in the image; requesting them would
          # upgrade held image packages, which this job forbids.
          apt-get install -y --no-install-recommends git python3 cmake ninja-build
          test "$(g++-15 -dumpfullversion)" = 15.2.0
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install exact Ubuntu compiler for QOJ
        if: matrix.acquisition == 'ubuntu'
        run: bash ci/profiles/install-ubuntu.sh "$COMPILER_PROVENANCE"
      - name: Build diagnostic distill
        run: |
          set -euo pipefail
          if [[ "$COMPILER_PROVENANCE" == image=* ]]; then export CXX=g++-15; fi
          cmake -S . -B out/profile-probe -G Ninja -DCMAKE_BUILD_TYPE=Release -DDISTILL_PROFILE_ONLY=ON -DBUILD_TESTING=OFF
          cmake --build out/profile-probe --target distill --parallel 2
          python3 ci/profiles/test_probe_cli.py out/profile-probe/distill tests/unit/fixtures/profile
      - name: Snapshot QOJ effective command (approximate)
        if: matrix.acquisition == 'ubuntu'
        run: |
          set -euo pipefail
          python3 ci/profiles/snapshot.py "data/judges/$PROFILE.toml" --compiler /usr/bin/g++-15
      - name: Produce QOJ expected diagnostic output
        if: matrix.acquisition == 'ubuntu'
        run: |
          set -euo pipefail
          python3 ci/profiles/probe.py "data/judges/$PROFILE.toml" --compiler /usr/bin/g++-15 --distill out/profile-probe/distill
      - name: Snapshot Kattis effective command (approximate)
        if: matrix.acquisition == 'image'
        run: |
          set -euo pipefail
          test "$(g++-15 -dumpfullversion)" = 15.2.0
          python3 ci/profiles/snapshot.py "data/judges/$PROFILE.toml" --compiler g++-15
      - name: Produce Kattis expected diagnostic output
        if: matrix.acquisition == 'image'
        run: |
          set -euo pipefail
          python3 ci/profiles/probe.py "data/judges/$PROFILE.toml" --compiler g++-15 --distill out/profile-probe/distill
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: snapshot-${{ matrix.profile }}
          path: |
            data/judges/${{ matrix.profile }}-predefined.txt
            data/judges/${{ matrix.profile }}-probe-expected.txt
          if-no-files-found: error
