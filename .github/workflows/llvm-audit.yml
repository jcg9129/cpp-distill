# SPDX-License-Identifier: GPL-3.0-or-later
name: Official LLVM archive audit
on:
  workflow_dispatch:
    inputs:
      llvm_version:
        description: Official LLVM release version
        default: '23.1.5'
        required: true
permissions:
  contents: read
concurrency:
  group: llvm-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - id: matrix
        shell: bash
        run: |
          set -euo pipefail
          echo "matrix=$(python3 ci/llvm/matrix.py --official)" >> "$GITHUB_OUTPUT"
  audit:
    needs: plan
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      SDK_SOURCE: official
      LLVM_VERSION: ${{ inputs.llvm_version }}
      SDK_REV: '1'
      SDK_PLATFORM: ${{ matrix.platform }}
      SDK_CONTAINER: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Python for native CI orchestration
        if: runner.os != 'Linux'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@a102174a2b586eec2ea151a69e6fd14404a8ce7c # v1.13.0
        with:
          arch: x64
      - name: Free disposable Linux runner disk before pulling the build image
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_OS bash ci/llvm/linux-cleanup.sh --host
      - name: Audit inside manylinux 2.28
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          bash ci/llvm/in-container.sh "$SDK_CONTAINER" bash -c '
            set -euo pipefail
            # Permit official static exports to find their optional dependencies;
            # report actual dynamic requirements from the linked stub afterwards.
            dnf install -y zlib-devel libzstd-devel libxml2-devel ncurses-devel libedit-devel
            python3 ci/llvm/acquire.py --source official --version "$LLVM_VERSION" --platform "$SDK_PLATFORM"
            python3 ci/llvm/audit-official.py --platform "$SDK_PLATFORM"
          '
      - name: Audit macOS archive
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check cmake==3.31.6 ninja==1.13.0
          python3 ci/llvm/acquire.py --source official --version "$LLVM_VERSION" --platform "$SDK_PLATFORM"
          python3 ci/llvm/audit-official.py --platform "$SDK_PLATFORM"
      - name: Audit Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --disable-pip-version-check cmake==3.31.6 ninja==1.13.0
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python ci/llvm/acquire.py --source official --version $env:LLVM_VERSION --platform $env:SDK_PLATFORM
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python ci/llvm/audit-official.py --platform $env:SDK_PLATFORM
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Inventory and actual consumer-link evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: official-audit-${{ matrix.platform }}
          path: |
            audit.json
            spike-work/*.json
            spike-work/*.log
          if-no-files-found: warn
