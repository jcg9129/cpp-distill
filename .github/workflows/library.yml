# SPDX-License-Identifier: GPL-3.0-or-later
name: L1c library feature macro data
on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - 'ci/library/**'
      - 'ci/profiles/**'
      - 'ci/extensions/**'
      - 'data/judges/**'
      - 'data/library/**'
      - 'data/names/**'
      - 'data/native/**'
      - '.github/workflows/library.yml'
      - '.github/workflows/profiles.yml'
      - '.github/workflows/extensions.yml'
permissions:
  contents: read
jobs:
  profiles:
    uses: ./.github/workflows/profiles.yml
    with:
      profiles: all
      artifact_prefix: library-snapshot
      cold_start: true
  extensions:
    uses: ./.github/workflows/extensions.yml
  data:
    needs: [profiles, extensions]
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python3 -m pip install --disable-pip-version-check -r ci/drift/requirements-test.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: library-snapshot-*
          path: out/library-input
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: extensions-*
          path: out/library-input
      - name: Regenerate and diff snapshots, dependencies, classification and agreement
        run: python3 ci/library/merge.py out/library-input --output out/library/library.json --check data/library/library.json
      - if: always() && !cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: library-generated
          path: |
            out/library/library.json
            out/library/library-evidence.json
          if-no-files-found: error
