# SPDX-License-Identifier: GPL-3.0-or-later
name: A1 reachable-header extension inventories
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          # Official GCC multi-architecture manifest digests from Docker Hub,
          # checked 2026-11-15. Profile versions plus newest stable GCC.
          - label: gcc-14
            runner: ubuntu-24.04
            image: gcc:14.2.0@sha256:b99b86a28812b1e6453a231a947dc43d76fe192788a12f344a9b568bf9f5d24c
          - label: gcc-15
            runner: ubuntu-24.04
            image: gcc:15.2.0@sha256:3ae15afe768b06d0c0fe088d822ba5f8045c26630bdacc8d8e7713cf5d8e7289
          - label: gcc-16
            runner: ubuntu-24.04
            image: gcc:16.2.0@sha256:5c2f83335c97e233c80d2bc754bd5c46b2d9c32f236a765a4ac40a59f216c064
          - label: alma-8
            runner: ubuntu-24.04
            image: almalinux:8
          - label: mingw
            runner: windows-2025
          - label: macos-arm64
            runner: macos-15
          - label: macos-x86_64
            runner: macos-15-intel
    env:
      SCAN_IMAGE: ${{ matrix.image }}
      SCAN_LABEL: ${{ matrix.label }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - if: runner.os != 'Linux'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Scan reachable Linux headers inside compatibility image
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --platform linux/amd64 -v "$PWD:/work" -w /work "$SCAN_IMAGE" bash -c '
            set -euo pipefail
            if command -v dnf >/dev/null; then
              dnf install -y python3.11 gcc-c++ glibc-headers
              py=python3.11
            else
              apt-get update -qq
              apt-get install -y --no-install-recommends python3
              py=python3
            fi
            "$py" ci/extensions/scan.py --platform linux --output-dir out/extensions --headers-version "$1"
          ' bash "$SCAN_IMAGE"
      - name: Scan reachable MSYS2 MinGW-w64 and libstdc++ headers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (!(Test-Path C:\msys64\usr\bin\bash.exe)) { throw 'MSYS2 missing from windows-2025 runner' }
          & C:\msys64\usr\bin\bash.exe -lc 'pacman -Sy --needed --noconfirm mingw-w64-x86_64-gcc'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $versions = & C:\msys64\usr\bin\bash.exe -lc 'pacman -Q | sed -n "/^mingw-w64-x86_64-\(gcc\|headers\|crt\)/p"'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:PATH = "C:\msys64\mingw64\bin;$env:PATH"
          python ci/extensions/scan.py --platform mingw --compiler C:/msys64/mingw64/bin/g++.exe --output-dir out/extensions --headers-version ($versions -join '; ')
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Scan reachable macOS SDK headers
        if: runner.os == 'macOS'
        shell: bash
        run: python3 ci/extensions/scan.py --platform macos --output-dir out/extensions --headers-version "$(sw_vers -productVersion); $(uname -m)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: extensions-${{ matrix.label }}
          path: out/extensions/*.txt
          if-no-files-found: error
  merge:
    needs: scan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: extensions-*
          path: artifacts/extensions
      - name: Merge all versions and platforms
        run: python3 ci/extensions/merge.py artifacts/extensions --output out/merged
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: extensions-merged
          path: out/merged/*.txt
          if-no-files-found: error
