# SPDX-License-Identifier: GPL-3.0-or-later
name: Distribution spike
on:
  pull_request:
  workflow_dispatch:
    inputs:
      sdk_source:
        description: SDK origin (release tag is llvm-<llvm_version>-<sdk_rev>)
        type: choice
        options: [release, run, official]
        default: release
      llvm_version:
        description: LLVM version
        default: '23.1.5'
        required: true
      sdk_rev:
        description: SDK settings revision
        default: '1'
        required: true
      sdk_run_id:
        description: llvm-sdk.yml run ID (required when sdk_source=run)
        default: ''
      platforms:
        description: all, or comma-separated platform names
        default: all
permissions:
  contents: read
concurrency:
  group: spike-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - id: matrix
        env:
          PLATFORMS: ${{ inputs.platforms || 'all' }}
          SDK_SOURCE: ${{ inputs.sdk_source || 'release' }}
          SDK_RUN_ID: ${{ inputs.sdk_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ $SDK_SOURCE == run && ! $SDK_RUN_ID =~ ^[0-9]+$ ]]; then
            echo 'sdk_run_id must be a numeric llvm-sdk.yml run ID' >&2
            exit 1
          fi
          options=()
          if [[ $SDK_SOURCE == official ]]; then options+=(--official); fi
          echo "matrix=$(python3 ci/llvm/matrix.py --platforms "$PLATFORMS" "${options[@]}")" >> "$GITHUB_OUTPUT"
  spike:
    permissions:
      contents: read
      actions: read
    needs: plan
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      SDK_SOURCE: ${{ inputs.sdk_source || 'release' }}
      LLVM_VERSION: ${{ inputs.llvm_version || '23.1.5' }}
      SDK_REV: ${{ inputs.sdk_rev || '1' }}
      SDK_PLATFORM: ${{ matrix.platform }}
      SDK_CONTAINER: ${{ matrix.container }}
      LC_ALL: C
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Python for native CI orchestration
        if: runner.os != 'Linux'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@a102174a2b586eec2ea151a69e6fd14404a8ce7c # v1.13.0
        with:
          arch: x64
      - name: SDK from a specific workflow run
        if: env.SDK_SOURCE == 'run'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: llvm-sdk-${{ env.LLVM_VERSION }}-${{ env.SDK_REV }}-${{ matrix.platform }}
          path: sdk-artifact
          run-id: ${{ inputs.sdk_run_id }}
          github-token: ${{ github.token }}
      - name: Free disposable Linux runner disk before pulling the build image
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_OS bash ci/llvm/linux-cleanup.sh --host
      - name: Build inside manylinux 2.28
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          bash ci/llvm/in-container.sh "$SDK_CONTAINER" bash ci/llvm/linux-build-stub.sh
      - name: Build on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check cmake==3.31.6 ninja==1.12.1
          python3 ci/llvm/acquire.py --source "$SDK_SOURCE" --version "$LLVM_VERSION" --rev "$SDK_REV" --platform "$SDK_PLATFORM"
          python3 ci/llvm/build-stub.py --platform "$SDK_PLATFORM"
      - name: Build on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --disable-pip-version-check cmake==3.31.6 ninja==1.12.1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python ci/llvm/acquire.py --source $env:SDK_SOURCE --version $env:LLVM_VERSION --rev $env:SDK_REV --platform $env:SDK_PLATFORM
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python ci/llvm/build-stub.py --platform $env:SDK_PLATFORM
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      # Separate processes/steps: remove SDK and build tree before any smoke run.
      - name: Move binary and delete SDK/build (Linux)
        id: isolate_linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          bash ci/llvm/in-container.sh "$SDK_CONTAINER" bash ci/llvm/linux-isolate.sh
      - name: Move binary and delete SDK/build (macOS)
        id: isolate_macos
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/llvm/isolate.py
      - name: Move binary and delete SDK/build (Windows)
        id: isolate_windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python ci/llvm/isolate.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Linux dependency gate
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          bash ci/llvm/in-container.sh "$SDK_CONTAINER" python3 ci/llvm/binary-audit.py isolated/distill-stub --output results/binary-audit.json
      - name: macOS dependency gate
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/llvm/binary-audit.py isolated/distill-stub --output results/binary-audit.json
      - name: Windows dependency gate
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python ci/llvm/binary-audit.py isolated/distill-stub.exe --output results/binary-audit.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Ubuntu system GCC (outside build container)
        if: ${{ !cancelled() && steps.isolate_linux.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/llvm/smoke.py --compiler /usr/bin/g++ --label ubuntu-system-gcc
      - name: AlmaLinux 8 GCC and glibc 2.28
        if: ${{ !cancelled() && steps.isolate_linux.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/llvm/alma-smoke.py
      - name: Homebrew GCC
        if: ${{ !cancelled() && steps.isolate_macos.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          selected=''
          newest=0
          for attempt in 1 2; do
            for candidate in /opt/homebrew/bin/g++-[0-9]* /usr/local/bin/g++-[0-9]*; do
              [[ -x $candidate ]] || continue
              version=${candidate##*-}
              if [[ $version =~ ^[0-9]+$ ]] && (( version > newest )); then
                selected=$candidate
                newest=$version
              fi
            done
            if [[ -n $selected ]]; then break; fi
            if (( attempt == 1 )); then brew install gcc; fi
          done
          [[ -n $selected ]] || { echo 'Homebrew GCC not found' >&2; exit 1; }
          python3 ci/llvm/smoke.py --compiler "$selected" --label homebrew-gcc
      - name: MinGW-w64 GCC, including Unicode and space path
        if: ${{ !cancelled() && steps.isolate_windows.outcome == 'success' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & C:\msys64\usr\bin\bash.exe -lc 'pacman -S --needed --noconfirm mingw-w64-ucrt-x86_64-gcc'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:PATH = "C:\msys64\ucrt64\bin;$env:PATH"
          python ci/llvm/smoke.py --compiler C:/msys64/ucrt64/bin/g++.exe --label mingw-ucrt64
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Binary and evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: spike-${{ matrix.platform }}
          path: |
            isolated/distill-stub*
            results/
            spike-work/*.json
            spike-work/*.log
          if-no-files-found: warn
  summary:
    needs: spike
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: spike-*
          path: artifacts
      - name: Combine measurements and observations
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/llvm/combined-summary.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: spike-combined-summary
          path: combined-summary.json
