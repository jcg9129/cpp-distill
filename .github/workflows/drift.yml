# SPDX-License-Identifier: GPL-3.0-or-later
name: Profile maintenance
on:
  schedule:
    - cron: '17 6 * * 1' # Weekly evidence and availability (UTC).
    - cron: '23 6 1 * *' # Monthly cold reproduction, separately scheduled.
  workflow_dispatch:
    inputs:
      claims:
        description: all, or comma-separated evidence,availability,reproduction
        type: string
        default: all
        required: true
      profiles:
        description: all, or comma-separated full profile names
        type: string
        default: all
        required: true
concurrency:
  group: profile-maintenance
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      claims: ${{ steps.plan.outputs.claims }}
      profiles: ${{ steps.plan.outputs.profiles }}
      evidence: ${{ steps.plan.outputs.evidence }}
      availability: ${{ steps.plan.outputs.availability }}
      reproduction: ${{ steps.plan.outputs.reproduction }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          CLAIMS: ${{ inputs.claims }}
          PROFILES: ${{ inputs.profiles }}
        run: python3 ci/drift/plan.py
  availability:
    needs: plan
    if: needs.plan.outputs.availability == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - env:
          PROFILES: ${{ needs.plan.outputs.profiles }}
        run: python3 ci/drift/availability.py --profiles "$PROFILES" --output out/drift/availability.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: drift-availability
          path: out/drift/availability.json
          if-no-files-found: error
  evidence:
    needs: plan
    if: needs.plan.outputs.evidence == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - env:
          PROFILES: ${{ needs.plan.outputs.profiles }}
        run: python3 ci/drift/evidence.py --profiles "$PROFILES" --output out/drift/evidence.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: drift-evidence
          path: out/drift/evidence.json
          if-no-files-found: error
  reproduction:
    needs: plan
    if: needs.plan.outputs.reproduction == 'true'
    uses: ./.github/workflows/profiles.yml
    with:
      profiles: ${{ needs.plan.outputs.profiles }}
      cold_start: true
    permissions:
      contents: read
  comparison:
    needs: [plan, reproduction]
    if: >-
      always() && !cancelled() && needs.plan.result == 'success' &&
      needs.plan.outputs.reproduction == 'true' &&
      (needs.reproduction.result == 'success' || needs.reproduction.result == 'failure')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: snapshot-*
          path: out/snapshots
      - name: Require both shipped outputs byte for byte for every selected profile
        env:
          PROFILES: ${{ needs.plan.outputs.profiles }}
          BUILD_RESULT: ${{ needs.reproduction.result }}
        run: python3 ci/drift/reproduction.py --profiles "$PROFILES" --artifacts out/snapshots --build-result "$BUILD_RESULT" --output out/drift/reproduction.json
      - if: always() && !cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: drift-reproduction
          path: out/drift/reproduction.json
          if-no-files-found: error
  report:
    needs: [plan, availability, evidence, reproduction, comparison]
    # A check's *classified* failures live in complete JSON. Infrastructure
    # failure/cancellation/skips leave state untouched for the whole run.
    if: >-
      always() && !cancelled() && needs.plan.result == 'success' &&
      (needs.plan.outputs.availability != 'true' || needs.availability.result == 'success') &&
      (needs.plan.outputs.evidence != 'true' || needs.evidence.result == 'success') &&
      (needs.plan.outputs.reproduction != 'true' ||
       ((needs.reproduction.result == 'success' || needs.reproduction.result == 'failure') &&
        (needs.comparison.result == 'success' || needs.comparison.result == 'failure')))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: drift-*
          path: out/results
      - env:
          GITHUB_TOKEN: ${{ github.token }}
          CLAIMS: ${{ needs.plan.outputs.claims }}
          PROFILES: ${{ needs.plan.outputs.profiles }}
        run: python3 ci/drift/report.py --profiles "$PROFILES" --claims "$CLAIMS" --artifacts out/results
