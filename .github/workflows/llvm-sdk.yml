# SPDX-License-Identifier: GPL-3.0-or-later
name: LLVM SDK
on:
  workflow_dispatch:
    inputs:
      llvm_version:
        description: Official LLVM release version
        default: '23.1.5'
        required: true
      sdk_rev:
        description: Settings revision (bump whenever build settings change)
        default: '1'
        required: true
      publish:
        description: Publish SDKs and corresponding source as a GitHub Release
        type: boolean
        default: false
      platforms:
        description: all, or comma-separated platform names
        default: all
        required: true
permissions:
  contents: read
# Deliberately never cancel an expensive SDK build (even a repeated dispatch).
concurrency:
  group: llvm-sdk-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - id: matrix
        env:
          PLATFORMS: ${{ inputs.platforms }}
        shell: bash
        run: |
          set -euo pipefail
          echo "matrix=$(python3 ci/llvm/matrix.py --platforms "$PLATFORMS")" >> "$GITHUB_OUTPUT"
  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.sdk_container }}
    timeout-minutes: 350
    env:
      LLVM_VERSION: ${{ inputs.llvm_version }}
      SDK_REV: ${{ inputs.sdk_rev }}
      SDK_PLATFORM: ${{ matrix.platform }}
      LC_ALL: C
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Python for native CI orchestration
        if: runner.os != 'Linux'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: MSVC static CRT environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@a102174a2b586eec2ea151a69e6fd14404a8ce7c # v1.13.0
        with:
          arch: x64
      - name: SDK build (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          if [[ $RUNNER_OS == Linux ]]; then
            bash ci/llvm/linux-cleanup.sh
            dnf install -y time xz
            source ci/llvm/environment.sh
          fi
          python3 -m pip install --disable-pip-version-check cmake==3.31.6 ninja==1.12.1
          python3 ci/llvm/build-sdk.py --version "$LLVM_VERSION" --rev "$SDK_REV" --platform "$SDK_PLATFORM"
      - name: SDK build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --disable-pip-version-check cmake==3.31.6 ninja==1.12.1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python ci/llvm/build-sdk.py --version $env:LLVM_VERSION --rev $env:SDK_REV --platform $env:SDK_PLATFORM
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: SDK and measurements
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: llvm-sdk-${{ inputs.llvm_version }}-${{ inputs.sdk_rev }}-${{ matrix.platform }}
          path: out/
          compression-level: 0
          if-no-files-found: warn
      - name: Full build log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: llvm-log-${{ matrix.platform }}
          path: |
            sdk-work/build.log
            sdk-work/build-time.txt
          if-no-files-found: ignore
      - name: Corresponding source (once per run)
        if: matrix.source_artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: llvm-source
          path: sdk-work/downloads/*.src.tar.xz
          compression-level: 0
          if-no-files-found: error
  publish:
    if: inputs.publish
    needs: build
    concurrency:
      group: llvm-sdk-publish-${{ inputs.llvm_version }}-${{ inputs.sdk_rev }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: llvm-*
          path: artifacts
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          LLVM_VERSION: ${{ inputs.llvm_version }}
          SDK_REV: ${{ inputs.sdk_rev }}
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/llvm/publish.py --version "$LLVM_VERSION" --rev "$SDK_REV"
